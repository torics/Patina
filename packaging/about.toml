# cargo-about: the licenses third-party crates may carry, the same list cargo-deny enforces (deny.toml).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
# Only what the shipped binary links: not tests, benches or build tools of other platforms.
ignore-build-dependencies = false
ignore-dev-dependencies = true
