[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.7", default-features = false, features = ["compression-gzip"] }
rusqlite = { version = "0.42", features = ["bundled"] }
rust-embed = "8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }
directories = "6"
tempfile = "3"
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
tokio-util = "0.7"
uuid = { version = "1", features = ["v7"] }
argon2 = "0.6"
chacha20poly1305 = "0.11"
sha2 = "0.11"
getrandom = "0.4"
patina-core = { path = "crates/patina-core" }
patina-store = { path = "crates/patina-store" }
patina-server = { path = "crates/patina-server" }
patina-providers = { path = "crates/patina-providers" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.release-symbols]
inherits = "release"
strip = false
