[package]
name = "patina-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
patina-core.workspace = true
patina-store.workspace = true
patina-providers.workspace = true
patina-tools.workspace = true
axum = { workspace = true, features = ["json", "query"] }
tokio = { workspace = true, features = ["process"] }
