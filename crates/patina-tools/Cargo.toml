[package]
name = "patina-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
patina-core.workspace = true
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["process", "fs", "io-util"] }
tokio-util.workspace = true
ignore = "0.4"
regex = "1"
similar = "3"
http = "1"
futures.workspace = true
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "kill-on-drop", "job-object"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process", "thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
rmcp = { version = "3.10", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum.workspace = true
serde.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
