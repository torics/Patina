name: ci
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The runner has Landlock and Docker. A sandbox test that cannot run here is a failure, not a skip.
      PATINA_REQUIRE_LANDLOCK: "1"
      PATINA_TEST_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: cargo fmt --check
      # Regenerates the UI's API types from the Rust types, then builds ui/dist for embedding.
      - run: cargo xtask ui
      - name: Generated API types are committed and current
        run: git diff --exit-code -- ui/src/api/generated && test -z "$(git status --porcelain -- ui/src/api/generated)"
      - run: npm test
        working-directory: ui
      - run: cargo clippy --all-targets -- -D warnings
      - name: Image for the container sandbox test
        run: docker pull alpine:3
      - run: cargo test --all
      # The runner's own cgroup is not delegated, so the cgroup test runs as a scope of its own that is, as root.
      - name: Command cgroups, in a cgroup delegated to the test alone
        run: |
          bin=$(cargo test -p patina-tools --test limits --no-run --message-format=json | jq -r 'select(.target.name == "limits" and .executable != null) | .executable')
          sudo env PATINA_TEST_CGROUP=1 PATH="$PATH" systemd-run --scope -p Delegate=yes --quiet -- "$bin" --exact commands_get_a_cgroup_of_their_own_that_holds_their_limits --nocapture
      - run: cargo build --release
      - name: What this host supports
        run: ./target/release/patina doctor --config-dir "$RUNNER_TEMP/patina-config" --data-dir "$RUNNER_TEMP/patina-data"
      - run: ./scripts/check-budgets.sh
      - run: ./scripts/check-install.sh
      - name: Browser smoke test
        working-directory: ui
        run: npx playwright install --with-deps chromium && npx playwright test --trace off
        env:
          PATINA_BIN: ${{ github.workspace }}/target/release/patina
  windows:
    # Patina on a real Windows host: build the exe, ask doctor what it supports, run the Rust tests and the browser tests against the exe.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: cargo xtask ui
      - run: cargo build --release --locked -p patina
      - name: What this host supports
        shell: bash
        run: ./target/release/patina doctor --config-dir "$RUNNER_TEMP/patina-config" --data-dir "$RUNNER_TEMP/patina-data"
      - name: Rust tests
        shell: bash
        run: cargo test --all --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/rust-tests.txt"
        continue-on-error: true
      - name: Browser smoke test against patina.exe
        working-directory: ui
        shell: bash
        run: npx playwright install chromium && npx playwright test --trace off
        env:
          PATINA_BIN: ${{ github.workspace }}\target\release\patina.exe
      - name: Summary of failed Rust tests
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/rust-tests.txt"; [ -f "$f" ] || exit 0
          sed 's/\x1b\[[0-9;]*m//g' "$f" | awk '/^---- .* stdout ----/{p=1} /^failures:$/{p=0} p' | cut -c1-400 | head -400
          grep -E "^test .* FAILED|targets? failed|^    \`-p" "$f" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: patina-windows-x64, path: target/release/patina.exe, if-no-files-found: error }
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: rustsec/audit-check@v2
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }
